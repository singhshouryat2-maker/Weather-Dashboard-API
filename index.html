<!-- =========================
     WEATHER DASHBOARD PROJECT
     Single File: HTML + CSS + JS
     ========================= -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>

  <!-- =========================
       CSS SECTION (STYLING)
       ========================= -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #9face6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    .result {
      margin-top: 20px;
    }

    img {
      width: 80px;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <!-- =========================
       HTML SECTION (STRUCTURE)
       ========================= -->
  <div class="card">
    <h1>🌤 Weather App</h1>
    
    <input type="text" id="city" placeholder="Enter city name">
    <br>
    <button onclick="getWeather()">Search</button>

    <div class="result" id="result"></div>
  </div>
